services:

  # ─── MQTT Broker ────────────────────────────────────────────
  mosquitto:
    image: eclipse-mosquitto:2.0
    restart: unless-stopped
    volumes:
      - ./config/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    ports:
      - "1883:1883"   # MQTT TCP
      - "9001:9001"   # WebSocket (debug / frontend)
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -W 3 | grep -q ."]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── PostgreSQL + PostGIS ───────────────────────────────────
  postgres:
    image: postgis/postgis:15-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-garden}
      POSTGRES_USER: ${POSTGRES_USER:-garden}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-garden} -d ${POSTGRES_DB:-garden}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── InfluxDB v2 (time-series) ─────────────────────────────
  influxdb:
    image: influxdb:2.7
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_INIT_USERNAME:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_INIT_PASSWORD:?Set INFLUXDB_INIT_PASSWORD in .env}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_INIT_ORG:-garden}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_INIT_BUCKET:-garden_telemetry}
      DOCKER_INFLUXDB_INIT_RETENTION: 90d
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_INIT_ADMIN_TOKEN:?Set INFLUXDB_INIT_ADMIN_TOKEN in .env}
    volumes:
      - influx_data:/var/lib/influxdb2
      - influx_config:/etc/influxdb2
    ports:
      - "8086:8086"
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Crear bucket adicional garden_events ───────────────────
  influxdb-init:
    image: influxdb:2.7
    depends_on:
      influxdb:
        condition: service_healthy
    restart: "no"
    environment:
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_INIT_ORG:-garden}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_INIT_ADMIN_TOKEN:?Set INFLUXDB_INIT_ADMIN_TOKEN in .env}
    volumes:
      - ./scripts/influxdb-init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    entrypoint: ["bash", "/docker-entrypoint-initdb.d/init.sh"]

  # ─── FastAPI Backend ────────────────────────────────────────
  api:
    build:
      context: ../spicy-merkaat-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      influxdb:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-garden}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB:-garden}
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN: ${INFLUXDB_INIT_ADMIN_TOKEN}
      INFLUX_ORG: ${INFLUXDB_INIT_ORG:-garden}
      INFLUX_BUCKET: ${INFLUXDB_INIT_BUCKET:-garden_telemetry}
      MQTT_BROKER: mosquitto
      MQTT_PORT: 1883
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      GARDEN_LAT: ${GARDEN_LAT:-42.948139}
      GARDEN_LON: ${GARDEN_LON:--2.83585}
    ports:
      - "8000:8000"
    volumes:
      - ../spicy-merkaat-backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ─── React Frontend (nginx) ────────────────────────────────
  frontend:
    build:
      context: ../spicy-merkaat-frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  mosquitto_data:
  mosquitto_log:
  pg_data:
  influx_data:
  influx_config:
